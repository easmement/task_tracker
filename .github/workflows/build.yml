name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Verify code health and formatting
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'any' # Dynamically checks all channels (stable/beta/dev/master)
          flutter-version-file: pubspec.yaml # Automatically reads the version constraint from your code
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

  # Job 2: Build the binaries using a macOS runner for Xcode tools
  build:
    needs: analyze
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'any'
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Build the Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # Build the iOS IPA (Compiles the Xcode workspace safely without code signing)
      - name: Build iOS IPA
        run: flutter build ipa --no-codesign

      # Upload Artifacts to your GitHub Actions run page
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/*.ipa

